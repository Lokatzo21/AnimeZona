<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeZona Scraper Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .terminal { background-color: #020617; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; overflow-y: auto; scroll-behavior: smooth; }
        .log-info { color: #94a3b8; }
        .log-success { color: #4ade80; font-weight: bold; }
        .log-warning { color: #facc15; }
        .log-error { color: #f87171; font-weight: bold; }
        /* Scrollbar custom */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="min-h-screen p-8 flex gap-6">

    <!-- Panel de Control -->
    <div class="glass-panel w-1/3 rounded-xl p-6 shadow-2xl flex flex-col gap-6">
        <div>
            <h1 class="text-2xl font-bold bg-gradient-to-r from-purple-400 to-blue-500 bg-clip-text text-transparent flex items-center gap-2">
                🤖 Robot Scraper Pro
            </h1>
            <p class="text-sm text-slate-400 mt-2">Extrae y guarda episodios automáticamente en tu Base de Datos Supabase.</p>
        </div>

        <form id="scrapeForm" class="flex flex-col gap-4">
            
            <div class="flex flex-col gap-1">
                <label class="text-sm font-semibold text-slate-300">Sitio a Scrapear</label>
                <select id="provider" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-purple-500">
                    <option value="animeonline">AnimeOnline Ninja (Predeterminado)</option>
                    <option value="zonaaps">ZonaAPS</option>
                </select>
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-sm font-semibold text-slate-300">URL del Anime</label>
                <input type="text" id="url" required placeholder="https://ww3.animeonline.ninja/online/..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-purple-500">
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-sm font-semibold text-slate-300">Nombre del Anime (DB)</label>
                <input type="text" id="title" required placeholder="Ej: horimiya" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-purple-500">
            </div>

            <div class="flex flex-col gap-1">
                <label class="text-sm font-semibold text-slate-300">Empezar desde el Episodio</label>
                <input type="number" id="startEpisode" value="1" min="1" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:ring-2 focus:ring-purple-500">
            </div>

            <div class="flex gap-4 mt-4">
                <button type="submit" id="startBtn" class="flex-1 bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 px-4 rounded-lg transition-all shadow-lg shadow-purple-500/30 flex justify-center items-center gap-2">
                    ▶ Iniciar Scraping
                </button>
                <button type="button" id="clearFormBtn" class="bg-slate-700 hover:bg-slate-600 text-slate-300 font-bold py-3 px-4 rounded-lg transition-all border border-slate-600 flex justify-center items-center" title="Limpiar Campos">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                    </svg>
                </button>
            </div>
        </form>

        <div class="mt-auto pt-6 border-t border-slate-700/50">
            <button id="stopBtn" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-2 px-4 rounded-lg transition-all border border-slate-700 flex justify-center items-center gap-2">
                Cerrar Navegador Chrome
            </button>
        </div>
    </div>

    <!-- Terminal -->
    <div class="glass-panel w-2/3 rounded-xl flex flex-col shadow-2xl relative max-h-[calc(100vh-4rem)]">
        <div class="bg-slate-900 border-b border-slate-800 p-3 flex items-center gap-3 shrink-0">
            <div class="flex gap-2">
                <div class="w-3 h-3 rounded-full bg-red-500"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
                <div class="w-3 h-3 rounded-full bg-green-500"></div>
            </div>
            <span class="text-sm font-mono text-slate-500 ml-2">terminal-log - bash</span>
            
            <button id="clearLogsBtn" class="ml-auto text-xs text-slate-400 hover:text-white bg-slate-800 px-3 py-1 rounded transition-colors">
                Limpiar Terminal
            </button>
        </div>
        <div id="terminal" class="terminal flex-1 p-6 text-sm overflow-y-auto">
            <!-- Logs se inyectarán aquí -->
        </div>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const form = document.getElementById('scrapeForm');
        const startBtn = document.getElementById('startBtn');
        
        function appendLog(message, type) {
            const el = document.createElement('div');
            el.className = `mb-1 log-${type}`;
            el.innerText = message;
            terminal.appendChild(el);
            terminal.scrollTop = terminal.scrollHeight;
        }

        // Conectar al sistema de eventos en vivo
        const evtSource = new EventSource('/api/logs');
        evtSource.onmessage = function(event) {
            const data = JSON.parse(event.data);
            appendLog(`[${data.timestamp}] ${data.message}`, data.type);
        };

        appendLog("Sistema inicializado. Esperando órdenes...", "info");

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const url = document.getElementById('url').value;
            const title = document.getElementById('title').value;
            const startEpisode = document.getElementById('startEpisode').value;
            const provider = document.getElementById('provider').value;

            startBtn.disabled = true;
            startBtn.innerHTML = "⏳ Procesando...";
            startBtn.classList.add('opacity-70');

            appendLog(`=================================`, "info");
            appendLog(`Enviando tarea al servidor backend...`, "info");

            try {
                const res = await fetch('/api/scrape', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url, title, startEpisode, provider })
                });
                
                const data = await res.json();
                if (data.error) appendLog(`Error: ${data.error}`, "error");
            } catch(e) {
                appendLog(`Error de red: ${e.message}`, "error");
            } finally {
                startBtn.disabled = false;
                startBtn.innerHTML = "▶ Iniciar Scraping";
                startBtn.classList.remove('opacity-70');
            }
        });

        document.getElementById('stopBtn').addEventListener('click', async () => {
            appendLog("Solicitando cierre del navegador...", "warning");
            await fetch('/api/stop', { method: 'POST' });
        });

        document.getElementById('clearLogsBtn').addEventListener('click', () => {
            terminal.innerHTML = '';
        });

        document.getElementById('clearFormBtn').addEventListener('click', () => {
            document.getElementById('url').value = '';
            document.getElementById('title').value = '';
            document.getElementById('startEpisode').value = '1';
        });
    </script>
</body>
</html>
